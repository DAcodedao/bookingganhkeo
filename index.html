    function bookingTable(){let rows=state.bookings.filter(b=>dateInRange(b.date));if(state.statusFilter!=='all')rows=rows.filter(b=>b.status===state.statusFilter);if(state.search){const q=state.search.toLowerCase();rows=rows.filter(b=>b.name.toLowerCase().includes(q)||b.phone.includes(q)||b.tableIds.join(' ').toLowerCase().includes(q))}rows.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));return `${pageHead('Lịch đặt','Booking',`${dateRangeText()} · ${rows.length} lượt đặt`,`${newButton()}${walkInButton()}`)}<div class="panel"><div class="panel-head"><div class="filters"><label class="toolbar-search">${ico('search')}<input data-search placeholder="Tên khách, số điện thoại, bàn" value="${esc(state.search)}"></label><select class="filter-select" data-status-filter><option value="all">Tất cả trạng thái</option>${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${state.statusFilter===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn small" data-action="export">${ico('download')} Xuất CSV</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Ngày</th><th>Giờ</th><th>Khách</th><th>Liên hệ</th><th>Số khách</th><th>Bàn</th><th>Tiền cọc</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(b=>`<tr data-booking="${b.id}"><td><strong>${esc(b.date)}</strong></td><td>${esc(b.time)}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${b.guests}</td><td>${displayTables(b)}</td><td>${money(b.deposit)}</td><td>${statusTag(b.status)}</td></tr>`).join('')}</tbody></table>${rows.length?'':`<div class="empty-state">${ico('book')}Không có booking phù hợp trong khoảng ngày đã chọn.</div>`}</div></div>`}
    function customersPage(){
      const q=state.customerSearch.toLowerCase();
      const groups=new Map();
      const addCustomer=(entry)=>{
        const key=entry.type==='walk-in'?'walk-in':(entry.phone||entry.name||'customer').trim().toLowerCase();
        if(!groups.has(key)){
          groups.set(key,{name:entry.type==='walk-in'?'Khách lẻ':entry.name||'Khách hàng',phone:entry.phone||'',type:entry.type||'booking',bookings:[],walkIns:[],walkInNames:new Set(),totalDeposit:0});
        }
        const target=groups.get(key);
        if(entry.type==='walk-in'){
          target.walkIns.push(entry.record);
          if(entry.name)target.walkInNames.add(entry.name);
        }else{
          target.bookings.push(entry.record);
          target.totalDeposit += Number(entry.record.deposit)||0;
        }
      };
      const rangeBookings=state.bookings.filter(booking=>dateInRange(booking.date));
      const rangeWalkIns=state.walkIns.filter(walkIn=>dateInRange(walkIn.date));
      rangeBookings.forEach(booking=>addCustomer({name:booking.name,phone:booking.phone||'',type:'booking',record:booking}));
      rangeWalkIns.forEach(walkIn=>addCustomer({name:walkIn.customerName||'Khách lẻ',phone:'',type:'walk-in',record:walkIn}));
      const customerList=[...groups.values()].filter(customer=>{
        const haystack=`${customer.name} ${customer.phone} ${customer.type} ${[...customer.walkInNames].join(' ')}`.toLowerCase();
        return !q || haystack.includes(q);
      });
      return `${pageHead('Hồ sơ khách','Khách hàng',`Khách hàng từ ${dateRangeText()}`,`${newButton()}${walkInButton()}`)}<section class="panel"><div class="panel-head"><div class="panel-title">${customerList.length} hồ sơ khách</div><label class="toolbar-search">${ico('search')}<input data-customer-search placeholder="Tìm số điện thoại hoặc tên" value="${esc(state.customerSearch)}"></label></div><div>${customerList.map(customer=>{
        const totalVisits=customer.bookings.length + customer.walkIns.length;
        const totalGuests=[...customer.bookings,...customer.walkIns].reduce((total,record)=>total+(Number(record.guests)||0),0);
        const actualTables=countActualTables([...customer.bookings,...customer.walkIns]);
        const label=customer.type==='walk-in' ? 'Khách lẻ' : 'Đặt chỗ';
        const metaParts=[customer.phone?esc(customer.phone):'Không có SĐT', `${totalVisits} lượt`, `${totalGuests} khách`, `${actualTables} bàn thực tế`, `Cọc ${money(customer.totalDeposit)}`];
        const showButton = customer.type==='walk-in' ? '<button class="btn small" data-walk-in-history>Xem lịch sử</button>' : `<button class="btn small" data-customer-phone="${esc(customer.phone)}">Xem lịch sử</button>`;
        return `<div class="customer-card"><div class="customer-head"><div><strong>${esc(customer.name)}</strong><div class="customer-meta">${label} · ${metaParts.join(' · ')}</div></div>${showButton}</div></div>`;
      }).join('')||'<div class="empty-state">Chưa có hồ sơ khách trong khoảng ngày này.</div>'}</div></section>`;
    }
    function depositsPage(){const rows=state.bookings.filter(b=>b.date===state.date&&+b.deposit>0).sort((a,b)=>a.time.localeCompare(b.time));const sum=rows.reduce((n,b)=>n+(+b.deposit||0),0);return `${pageHead('Đối soát','Tiền cọc',`${dateLabel(state.date)} · ${rows.length} khoản cọc`,`${newButton()}${walkInButton()}`)}${statsMarkup([{label:'Tổng tiền cọc',value:money(sum),icon:'wallet',note:'Theo ngày đang chọn'},{label:'Đã nhận cọc',value:rows.length,icon:'check',note:'Booking có ghi nhận tiền cọc'},{label:'Chưa đặt cọc',value:state.bookings.filter(b=>b.date===state.date&&b.status==='confirmed'&&!b.deposit).length,icon:'clock',note:'Cần theo dõi xác nhận'}])}<section class="panel"><div class="panel-head"><div class="panel-title">Chi tiết tiền cọc</div><span class="note">Cọc được ghi nhận trong từng booking</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Giờ</th><th>Khách</th><th>Số điện thoại</th><th>Bàn</th><th>Tiền cọc</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(b=>`<tr data-booking="${b.id}"><td>${b.time}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${displayTables(b)}</td><td><strong>${money(b.deposit)}</strong></td><td>${statusTag(b.status)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty-state">Ngày này chưa ghi nhận tiền cọc.</div>'}</div></section>`}
    function reportsPage(){
      const mode=state.reportMode,anchor=state.date.slice(0,4),labels=[],values=[],periodRows=[];
      if(mode==='month'){
        for(let i=1;i<=12;i++){
          const month=`${anchor}-${String(i).padStart(2,'0')}`;
          const bookings=state.bookings.filter(booking=>booking.date.startsWith(month)&&!['cancelled','no-show'].includes(booking.status));
          const walkIns=state.walkIns.filter(walkIn=>walkIn.date.startsWith(month)&&walkIn.status!=='cancelled');
          labels.push(`T${i}`);values.push(bookings.length);
          periodRows.push({label:`Tháng ${i}`,bookingTables:countTableUsages(bookings),bookingGuests:bookings.reduce((sum,booking)=>sum+(+booking.guests||0),0),walkInTables:countTableUsages(walkIns),walkInGuests:walkIns.reduce((sum,walkIn)=>sum+(+walkIn.guests||0),0)});
        }
      }else if(mode==='year'){
        for(let i=anchor-4;i<=+anchor;i++){
          const year=String(i);
          const bookings=state.bookings.filter(booking=>booking.date.startsWith(year)&&!['cancelled','no-show'].includes(booking.status));
          const walkIns=state.walkIns.filter(walkIn=>walkIn.date.startsWith(year)&&walkIn.status!=='cancelled');
          labels.push(String(i));values.push(bookings.length);
          periodRows.push({label:`Năm ${i}`,bookingTables:countTableUsages(bookings),bookingGuests:bookings.reduce((sum,booking)=>sum+(+booking.guests||0),0),walkInTables:countTableUsages(walkIns),walkInGuests:walkIns.reduce((sum,walkIn)=>sum+(+walkIn.guests||0),0)});
        }
      }else{
        const date=new Date(state.date+'T12:00:00'),first=new Date(date);first.setDate(date.getDate()-6);
        for(let i=0;i<7;i++){
          const day=new Date(first);day.setDate(first.getDate()+i);
          const dayKey=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
          const bookings=state.bookings.filter(booking=>booking.date===dayKey&&!['cancelled','no-show'].includes(booking.status));
          const walkIns=state.walkIns.filter(walkIn=>walkIn.date===dayKey&&walkIn.status!=='cancelled');
          labels.push(new Intl.DateTimeFormat('vi-VN',{weekday:'short'}).format(day));values.push(bookings.length);
          periodRows.push({label:dateLabel(dayKey,{weekday:'short',day:'numeric',month:'short'}),bookingTables:countTableUsages(bookings),bookingGuests:bookings.reduce((sum,booking)=>sum+(+booking.guests||0),0),walkInTables:countTableUsages(walkIns),walkInGuests:walkIns.reduce((sum,walkIn)=>sum+(+walkIn.guests||0),0)});
        }
      }
      const total=values.reduce((sum,value)=>sum+value,0),max=Math.max(...values,1);
      const comparison=mode==='month'?`Tổng booking năm ${anchor}`:mode==='year'?'Tổng booking theo năm':'Booking 7 ngày gần nhất';
      const accepted=state.bookings.filter(booking=>!['cancelled','no-show'].includes(booking.status));
      const summaryTable=mode==='week'?`<div class="table-wrap" style="margin-top:16px"><table class="data-table"><thead><tr><th>Thứ / ngày / tháng</th><th>Khách booking</th><th>Khách lẻ</th><th>Tổng ngày</th></tr></thead><tbody>${periodRows.map(row=>{const totalTables=row.bookingTables+row.walkInTables,totalGuests=row.bookingGuests+row.walkInGuests;return `<tr><td>${row.label}${row.label===dateLabel(state.date,{weekday:'short',day:'numeric',month:'short'})?' · Hôm nay':''}</td><td>${row.bookingTables} bàn · ${row.bookingGuests} khách</td><td>${row.walkInTables} bàn · ${row.walkInGuests} khách</td><td>${totalTables} bàn · ${totalGuests} khách</td></tr>`;}).join('')}</tbody></table></div>`:`<div class="table-wrap" style="margin-top:16px"><table class="data-table"><thead><tr><th>${mode==='month'?'Tháng':'Năm'}</th><th>Khách booking</th><th>Khách lẻ</th><th>Tổng</th></tr></thead><tbody>${periodRows.map(row=>{const totalTables=row.bookingTables+row.walkInTables,totalGuests=row.bookingGuests+row.walkInGuests;return `<tr><td>${row.label}</td><td>${row.bookingTables} bàn · ${row.bookingGuests} khách</td><td>${row.walkInTables} bàn · ${row.walkInGuests} khách</td><td>${totalTables} bàn · ${totalGuests} khách</td></tr>`;}).join('')}</tbody></table></div>`;
      return `${pageHead('Phân tích hoạt động','Báo cáo','So sánh booking theo ngày, tháng và năm',`${newButton()}${walkInButton()}`)}<div class="filters" style="margin-bottom:14px"><div class="floor-tabs"><button class="floor-tab ${mode==='week'?'active':''}" data-report="week">7 ngày</button><button class="floor-tab ${mode==='month'?'active':''}" data-report="month">Theo tháng</button><button class="floor-tab ${mode==='year'?'active':''}" data-report="year">Theo năm</button></div><label class="note">Năm tham chiếu: <input class="filter-select" type="number" min="2020" max="2100" value="${anchor}" data-report-year style="width:86px"></label></div><div class="report-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">${comparison}</div><div class="panel-note">Không tính booking đã hủy hoặc khách không đến</div></div></div><div class="panel-body"><div class="report-total">${total}<span style="font:400 12px 'DM Sans',sans-serif;color:var(--muted)"> booking</span></div><div class="bar-chart">${values.map((value,index)=>`<div class="bar-col"><span class="bar-value">${value||''}</span><div class="bar ${index===values.length-1?'current':''}" style="height:${Math.max(value/max*100,value?5:2)}%"></div><span class="bar-label">${labels[index]}</span></div>`).join('')}</div>${summaryTable}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Tổng hợp trạng thái</div><div class="panel-note">${accepted.length} booking hợp lệ toàn thời gian</div></div></div><div class="panel-body">${Object.entries(statusNames).map(([key,name])=>{const count=state.bookings.filter(booking=>booking.status===key).length;return `<div class="detail-line"><span>${statusTag(key)}</span><strong>${count}</strong></div>`}).join('')}<div class="detail-line"><span>Tiền cọc đã ghi nhận</span><strong>${money(state.bookings.reduce((sum,booking)=>sum+(+booking.deposit||0),0))}</strong></div></div></section></div>`
    }
    function historyPage(){const rows=[...state.history].reverse();return `${pageHead('Nhật ký hệ thống','Lịch sử','Theo dõi chỉnh sửa booking và thao tác bàn',`${newButton()}${walkInButton()}`) }<section class="panel"><div class="panel-head"><div class="panel-title">${rows.length} hoạt động gần đây</div><button type="button" class="btn small" data-action="clear-history">Xóa lịch sử</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Thời gian</th><th>Chức vụ</th><th>Thao tác</th><th>Booking / bàn</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${new Date(h.at).toLocaleString('vi-VN')}</td><td>${esc(h.by)}</td><td>${esc(h.action)}</td><td>${esc(h.subject)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty-state">Thao tác chỉnh sửa sẽ được lưu tại đây.</div>'}</div></section>`}
    function settingsPage(){return `${pageHead('Thiết lập nhà hàng','Cài đặt','Tuỳ chỉnh giao diện, phân quyền và dữ liệu',`${newButton()}${walkInButton()}`) }<div class="settings-grid"><section class="panel"><div class="panel-head"><div class="panel-title">Giao diện & thông báo</div></div><div class="panel-body"><div class="setting-row"><div><strong>Chế độ tối</strong><small>Đổi giao diện cho môi trường thiếu sáng</small></div><input type="checkbox" class="switch" data-setting-theme ${state.theme==='dark'?'checked':''}></div><div class="setting-row"><div><strong>Cảnh báo trùng giờ</strong><small>Nhắc khi một bàn có booking cùng ngày, cùng giờ</small></div><input type="checkbox" class="switch" data-setting-conflict checked></div><div class="setting-row"><div><strong>Nhắc booking chưa đến</strong><small>Hiện các booking chưa check-in trong ngày</small></div><input type="checkbox" class="switch" checked disabled></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Nhân sự & dữ liệu</div></div><div class="panel-body"><div class="setting-row"><div><strong>Vai trò hiện tại</strong><small>${state.canManageData?'Toàn quyền thao tác và cài đặt':'Nhân viên · thao tác booking'}</small></div><span class="status ${state.canManageData?'deposit':'arrived'}">${state.role}</span></div><div class="setting-row"><div><strong>Lưu trữ</strong><small>Dữ liệu đồng bộ qua Supabase</small></div><span class="status arrived">Đang hoạt động</span></div>${state.canManageData?`<div class="setting-row"><div><strong>Dữ liệu booking</strong><small>${state.bookings.length} booking · ${state.history.length} dòng lịch sử</small></div><button class="btn small danger" data-action="reset-data">${ico('refresh')} Xóa dữ liệu</button></div>`:'<div class="setting-row"><div><strong>Dữ liệu booking</strong><small>${state.bookings.length} booking · ${state.history.length} dòng lịch sử</small></div><span class="status arrived">Chỉ xem</span></div>'}</div></section><section class="panel"><div class="panel-head"><div class="panel-title">Danh sách bàn</div></div><div class="panel-body"><div class="detail-line"><span>Trệt</span><strong>T01 – T08 · 8 bàn</strong></div><div class="detail-line"><span>Lầu 1</span><strong>L101 – L112 · 12 bàn</strong></div><div class="detail-line"><span>Lầu 2</span><strong>L201 – L205 · 5 bàn</strong></div><div class="detail-line"><span>Sân thượng</span><strong>ST01 – ST15 · 15 bàn</strong></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Gợi ý vận hành</div></div><div class="panel-body"><p class="note">Để dữ liệu dùng chung giữa nhiều thiết bị và nhân viên, bản vận hành chính thức nên kết nối cơ sở dữ liệu và đăng nhập có phân quyền ở máy chủ. Bản hiện tại lưu trên thiết bị đang mở.</p><p class="note">Thời gian khách lưu trú được đếm từ lúc check-in đến khi hoàn tất booking; hệ thống không đặt sẵn thời lượng ngồi.</p></div></section></div>`}
    function overviewDailyMetrics(){
      const reserved=state.bookings.filter(booking=>booking.date===state.date&&booking.status!=='cancelled');
      const seated=reserved.filter(booking=>booking.status==='arrived');
      const seatedWalkIns=state.walkIns.filter(walkIn=>walkIn.date===state.date&&walkIn.status==='arrived');
      const waiting=reserved.filter(booking=>['confirmed'].includes(booking.status));
      const validBookings=state.bookings.filter(booking=>booking.date===state.date&&!['cancelled','no-show'].includes(booking.status));
      const validWalkIns=state.walkIns.filter(walkIn=>walkIn.date===state.date&&walkIn.status!=='cancelled');
      const usedTableCount=countTableUsages(validBookings)+countTableUsages(validWalkIns);
      const usedGuests=validBookings.reduce((total,booking)=>total+(+booking.guests||0),0)+validWalkIns.reduce((total,walkIn)=>total+(+walkIn.guests||0),0);
      const countTables=records=>countTableUsages(records);
      const countGuests=bookings=>bookings.reduce((total,booking)=>total+(+booking.guests||0),0);
      const deposits=state.bookings.filter(booking=>booking.date===state.date&&(+booking.deposit||0)>0);
      const occupiedTableCount=countTableUsages(seated)+countTableUsages(seatedWalkIns);
      return[
        {label:'Tổng số bàn và khách đã sử dụng trong ngày',value:`<div class="stat-split"><div class="stat-main"><div class="total-line"><strong>${usedTableCount}</strong><span>bàn</span></div><div class="total-line"><strong>${usedGuests}</strong><span>khách</span></div></div><div class="stat-detail"><div class="stat-detail-row"><span>Booking:</span><strong>${validBookings.length}</strong></div><div class="stat-detail-row"><span>${countTables(validBookings)} bàn · ${countGuests(validBookings)} khách</span></div><div class="stat-detail-row"><span>Khách lẻ:</span><strong>${countTables(validWalkIns)} bàn · ${validWalkIns.reduce((total,walkIn)=>total+(+walkIn.guests||0),0)} khách</strong></div></div></div>`,icon:'grid',note:`${usedGuests} khách · ${validBookings.length + validWalkIns.length} lượt (booking + khách lẻ)`},
        {label:'Bàn đang sử dụng',value:occupiedTableCount,icon:'grid',note:`${countGuests(seated)+countGuests(seatedWalkIns)} khách đang ngồi`},
        {label:'Bàn chờ khách check-in',value:countTables(waiting),icon:'clock',note:`${countGuests(waiting)} khách · ${waiting.length} booking`},
        {label:'Tiền cọc trong ngày',value:money(deposits.reduce((total,booking)=>total+(+booking.deposit||0),0)),icon:'wallet',note:`${deposits.length} booking có cọc`}
      ];
    }
    function render(){
      document.getElementById('app').innerHTML=shell();addMobileSettingsLink();
      const views={overview,map:mapPage,bookings:bookingTable,customers:customersPage,deposits:depositsPage,reports:reportsPage,history:historyPage,settings:settingsPage};
      document.getElementById('content').innerHTML=(views[state.page]||overview)();
      if(state.page==='overview'){
        const stats=document.querySelector('.content .stats');
        if(stats)stats.outerHTML=statsMarkup(overviewDailyMetrics());
        document.querySelectorAll('.floor-summary').forEach((summary,index)=>{
          const floor=floors[index];if(!floor)return;

      const split=group&&state.canManageData?`<button class="btn small" data-action="split-this" data-table-id="${tableId}">${ico('merge')} Tách nhóm bàn</button>`:'';
      const extraActions=split?`<div class="detail-actions" style="margin-top:13px">${split}</div>`:'';
      modal(`${tableId} · ${meta.zone}`,`${meta.floor} · ${dateLabel(state.date)} · ${bookings.length} booking · ${walkIns.length} khách lẻ`,`${list}${extraActions}`,`<button class="btn" data-action="close-modal">Đóng</button><span class="spacer"></span><button class="btn" data-action="new-walk-in" data-table-id="${tableId}">${ico('users')} Ghi nhận khách lẻ</button><button class="btn primary" data-action="new-at-table" data-table-id="${tableId}">${ico('plus')} Thêm booking</button>`,true);

      document.querySelectorAll('[data-complete-walk-in]').forEach(button=>button.addEventListener('click',()=>completeWalkIn(button.dataset.completeWalkIn)));
      document.querySelectorAll('[data-cancel-walk-in]').forEach(button=>button.addEventListener('click',()=>cancelWalkIn(button.dataset.cancelWalkIn)));

      document.querySelectorAll('[data-table-change-kind]').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();openTableChange(button.dataset.tableChangeKind,button.dataset.tableChangeId)}));

    function openTableChange(kind,id){

      document.querySelector('[data-action="save-table-change"]').addEventListener('click',saveTableChange);
    }
    function saveTableChange(){
      const {kind,id,picked}=state.modal||{};if(!picked?.size){toast('Chọn ít nhất một bàn');return}
      const item=kind==='booking'?state.bookings.find(booking=>booking.id===id):state.walkIns.find(walkIn=>walkIn.id===id&&walkIn.status==='arrived');if(!item)return;
      const conflictsWithBooking=state.bookings.some(booking=>booking.id!==id&&booking.date===item.date&&booking.time===item.time&&booking.tableIds.some(tableId=>picked.has(tableId))&&!['cancelled','completed','no-show'].includes(booking.status));
      const conflictsWithWalkIn=state.walkIns.some(walkIn=>walkIn.id!==id&&walkIn.date===item.date&&walkIn.time===item.time&&walkIn.status==='arrived'&&walkIn.tableIds.some(tableId=>picked.has(tableId)));
      if(conflictsWithBooking||conflictsWithWalkIn){toast('Bàn đã có khách trong khung giờ này');return}
      const previous=item.tableIds.join(' + '),next=[...picked];item.tableIds=next;
      const guestName=kind==='booking'?item.name:(item.customerName||'Khách lẻ');audit('Đổi bàn',`${guestName} · ${previous} → ${next.join(' + ')}`);save();closeModal();render();toast(`Đã đổi bàn sang ${next.join(' + ')}`);
    }
    function openWalkIn(defaultTables=[], id=null){
      const existing= id ? state.walkIns.find(item=>item.id===id) : null;
      const picked=new Set(existing?.tableIds || defaultTables),now=new Date(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      state.modal={type:'walk-in',id:existing?.id||null,picked};

      const activeTableNote=[...picked].some(tableId=>state.walkIns.some(walkIn=>walkIn.id!==existing?.id&&walkIn.date===state.date&&walkIn.status==='arrived'&&walkIn.tableIds.includes(tableId))) ? '<div class="note" style="color:var(--warning);margin-top:8px">Bàn đang có lượt khách lẻ đang phục vụ. Nếu nhập số khách bên dưới, hệ thống sẽ cộng vào lượt hiện tại thay vì tạo mới.</div>' : '';

      const saveLabel=existing?'Lưu thay đổi':'Bắt đầu phục vụ';
      const deleteAction=existing?`<button class="btn danger small" data-action="delete-walk-in-edit">${ico('trash')} Xóa khách lẻ</button>`:'';
      modal(existing?'Chỉnh sửa khách lẻ':'Ghi nhận khách lẻ',existing?`${esc(existing.customerName||'Khách lẻ')} · ${existing.guests} khách`:'Lượt phục vụ này được lưu riêng, không tính vào booking',body,`${deleteAction}<button class="btn" data-action="close-modal">Hủy</button><span class="spacer"></span><button class="btn primary" data-action="save-walk-in">${ico('check')} ${saveLabel}</button>`,true);
      groupWalkInPicker();
      document.querySelector('[data-action="delete-walk-in-edit"]')?.addEventListener('click',()=>deleteWalkIn(existing.id));
      document.querySelectorAll('[data-walk-in-table]').forEach(button=>button.addEventListener('click',()=>{
        const tableId=button.dataset.walkInTable;
        if(picked.has(tableId))picked.delete(tableId);else picked.add(tableId);
        button.classList.toggle('selected',picked.has(tableId));
        const overlap=[...picked].some(id=>state.walkIns.some(walkIn=>walkIn.id!==existing?.id&&walkIn.date===state.date&&walkIn.status==='arrived'&&walkIn.tableIds.includes(id)));
        const noteEl=document.querySelector('#walk-in-form .note[style*="color:var(--warning)"]');
        if(noteEl){noteEl.remove();}
        const selectedText=picked.size?`Đã chọn: ${[...picked].join(' + ')}`:'Chọn ít nhất một bàn';
        document.getElementById('walk-in-picked').textContent=selectedText;
        if(overlap){

          document.getElementById('walk-in-picked').insertAdjacentElement('afterend',note);
        }
      }));
      document.querySelector('[data-action="save-walk-in"]').addEventListener('click',saveWalkIn);
    }
    function saveWalkIn(){
      const form=document.getElementById('walk-in-form');if(!form.reportValidity())return;
      if(!state.modal.picked.size){toast('Chọn ít nhất một bàn cho khách lẻ');return}
      const data=Object.fromEntries(new FormData(form)),tableIds=[...state.modal.picked];
      const customerName=(data.customerName||'').trim();
      const isEditing=!!state.modal.id;
      const currentWalkIn=isEditing?state.walkIns.find(item=>item.id===state.modal.id):null;
      const walkInDate=currentWalkIn?data.date:state.date;
      const arrivalTime=currentWalkIn?.time || `${String(new Date().getHours()).padStart(2,'0')}:${String(new Date().getMinutes()).padStart(2,'0')}`;
      const bookingConflict=state.bookings.some(booking=>booking.date===walkInDate&&booking.time===arrivalTime&&booking.tableIds.some(tableId=>tableIds.includes(tableId))&&!['cancelled','completed','no-show'].includes(booking.status));
      if(bookingConflict){toast(`Bàn đã có lượt đặt lúc ${arrivalTime}`);return}
      const walkInConflict=currentWalkIn?state.walkIns.some(walkIn=>walkIn.id!==currentWalkIn.id&&walkIn.date===walkInDate&&walkIn.time===arrivalTime&&walkIn.status==='arrived'&&walkIn.tableIds.some(tableId=>tableIds.includes(tableId))):state.walkIns.some(walkIn=>walkIn.date===walkInDate&&walkIn.time===arrivalTime&&walkIn.status==='arrived'&&walkIn.tableIds.some(tableId=>tableIds.includes(tableId)));
      if(walkInConflict){toast(`Bàn đã có lượt khách lẻ đang phục vụ lúc ${arrivalTime}`);return}
      if(isEditing && currentWalkIn){
        currentWalkIn.customerName=customerName;
        currentWalkIn.guests=Math.max(1,+data.guests||1);
        currentWalkIn.date=walkInDate;
        currentWalkIn.tableIds=[...new Set(tableIds)];
        currentWalkIn.time=arrivalTime;
        currentWalkIn.staffName=currentUser?.email||state.role;
        state.date=currentWalkIn.date;
        audit('Chỉnh sửa khách lẻ',`${currentWalkIn.customerName||'Khách lẻ'} · ${currentWalkIn.guests} khách · bàn ${currentWalkIn.tableIds.join(' + ')}`);
        save();closeModal();render();toast('Đã cập nhật khách lẻ');
        return;
      }
      const extraGuests=Math.max(1,+data.guests||1);
      const existingWalkIn=state.walkIns.find(walkIn=>walkIn.date===walkInDate&&walkIn.status==='arrived'&&walkIn.tableIds.some(tableId=>tableIds.includes(tableId)));
      if(existingWalkIn){
        existingWalkIn.guests += extraGuests;
        existingWalkIn.tableIds=[...new Set([...existingWalkIn.tableIds,...tableIds])];
        if(customerName && !existingWalkIn.customerName)existingWalkIn.customerName=customerName;
        existingWalkIn.time=arrivalTime;
        audit('Cộng thêm khách lẻ',`${existingWalkIn.customerName||'Khách lẻ'} · +${extraGuests} khách · bàn ${existingWalkIn.tableIds.join(' + ')} · ${existingWalkIn.date}`);
        save();closeModal();render();toast(`Đã cộng thêm ${extraGuests} khách lẻ, tổng ${existingWalkIn.guests} khách`);
        return;
      }
      const walkIn={id:crypto.randomUUID(),date:walkInDate,time:arrivalTime,tableIds,customerName,guests:extraGuests,status:'arrived',checkIn:new Date().toISOString(),completedAt:null,staffName:currentUser?.email||state.role};
      state.walkIns.push(walkIn);state.date=walkIn.date;audit('Ghi nhận khách lẻ',`${walkIn.customerName||'Khách lẻ'} · ${walkIn.guests} khách · bàn ${tableIds.join(' + ')} · ${walkIn.date}`);save();closeModal();render();toast(`Đã ghi nhận ${walkIn.guests} khách lẻ`);
    }
    function cancelWalkIn(id){

      showConfirmation({title:'Hủy lượt khách lẻ?',message:'Bàn sẽ được giải phóng và lượt phục vụ sẽ dừng hoạt động.',confirmLabel:'Hủy lượt',iconName:'close',details:[{label:'Khách',value:`${walkIn.customerName||'Khách lẻ'} · ${walkIn.guests} khách`},{label:'Bàn',value:walkIn.tableIds.join(' + ')},{label:'Ngày',value:walkIn.date}],onConfirm:()=>{walkIn.status='cancelled';walkIn.completedAt=new Date().toISOString();audit('Hủy khách lẻ',`${walkIn.customerName||'Khách lẻ'} · ${walkIn.guests} khách · bàn ${walkIn.tableIds.join(' + ')}`);save();closeModal();render();openWalkInDetail(id);toast('Đã hủy lượt khách lẻ')}})

    function openWalkInDetail(id){

    function checkIn(id){const b=state.bookings.find(x=>x.id===id);if(!b||!['confirmed'].includes(b.status))return;showConfirmation({title:'Xác nhận khách đã đến?',message:'Bộ đếm thời gian lưu trú sẽ bắt đầu ngay khi xác nhận check-in.',confirmLabel:'Check-in',iconName:'check',tone:'success',details:[{label:'Khách',value:b.name},{label:'Thời gian',value:`${dateLabel(b.date,{day:'numeric',month:'short',year:'numeric'})} · ${b.time}`},{label:'Bàn',value:displayTables(b)},{label:'Số khách',value:`${b.guests} khách`}],onConfirm:()=>{b.status='arrived';b.checkIn=new Date().toISOString();audit('Check-in khách',`${b.name} · ${displayTables(b)}`);save();closeModal();render();toast(`Đã check-in ${b.name}. Bắt đầu tính thời gian.`)}})}
    function completeBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b||b.status!=='arrived')return;showConfirmation({title:'Xác nhận hoàn tất booking?',message:'Bộ đếm thời gian lưu trú sẽ dừng sau khi xác nhận hoàn tất.',confirmLabel:'Xác nhận hoàn tất',iconName:'check',tone:'success',details:[{label:'Khách',value:b.name},{label:'Bàn',value:displayTables(b)},{label:'Số khách',value:`${b.guests} khách`},{label:'Đã dùng bàn',value:b.checkIn?document.querySelector(`[data-elapsed="${CSS.escape(b.checkIn)}"]`)?.textContent||'Đang cập nhật':'Không có dữ liệu'}],onConfirm:()=>{b.status='completed';b.completedAt=new Date().toISOString();audit('Hoàn tất booking',`${b.name} · ${displayTables(b)}`);save();closeModal();render();toast('Đã hoàn tất booking')}})}
    function cancelBooking(id){const b=state.bookings.find(x=>x.id===id);if(!b||b.status==='cancelled')return;showConfirmation({title:'Hủy booking này?',message:'Bàn sẽ được giải phóng; thông tin booking vẫn được lưu trong lịch sử.',confirmLabel:'Hủy booking',iconName:'close',details:[{label:'Khách',value:b.name},{label:'Thời gian',value:`${dateLabel(b.date,{day:'numeric',month:'short',year:'numeric'})} · ${b.time}`},{label:'Bàn',value:displayTables(b)},{label:'Số khách',value:`${b.guests} khách`}],onConfirm:()=>{b.status='cancelled';b.cancelledAt=new Date().toISOString();audit('Hủy booking',`${b.name} · ${b.date} ${b.time} · ${displayTables(b)}`);save();closeModal();render();toast(`Đã hủy booking của ${b.name}`)}})}
    function openBookingDetail(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;state.modal={type:'detail',id:b.id};const elapsed=b.checkIn&&b.status==='arrived'?`<div class="detail-line"><span>Khách đã dùng bàn</span><strong class="elapsed" data-elapsed="${b.checkIn}"></strong></div>`:'';const hasCheck=['confirmed'].includes(b.status);const canCancel=!['cancelled','completed','no-show'].includes(b.status);modal(esc(b.name),`${esc(b.phone)} · ${b.guests} khách`,`<div class="detail-line"><span>Ngày & giờ</span><strong>${dateLabel(b.date,{day:'numeric',month:'long',year:'numeric'})} · ${b.time}</strong></div><div class="detail-line"><span>Bàn</span><strong>${displayTables(b)}</strong></div><div class="detail-line"><span>Trạng thái</span>${statusTag(b.status)}</div><div class="detail-line"><span>Số lượng khách</span><strong>${b.guests} khách</strong></div><div class="detail-line"><span>Tiền cọc</span><strong>${money(b.deposit)}</strong></div>${elapsed}${b.note?`<div class="detail-note"><strong>Ghi chú</strong><br>${esc(b.note)}</div>`:''}<div class="detail-actions" style="margin-top:14px">${hasCheck?`<button class="btn primary small" data-detail-checkin="${b.id}">${ico('check')} Check-in</button>`:''}${b.status==='arrived'?`<button class="btn soft small" data-complete="${b.id}">${ico('check')} Hoàn tất</button>`:''}${canCancel?`<button class="btn danger small" data-cancel-booking="${b.id}">${ico('close')} Hủy booking</button>`:''}${b.status==='completed'?`<span class="note">Hoàn tất ${b.completedAt?new Date(b.completedAt).toLocaleString('vi-VN'):''}</span>`:''}${b.status==='cancelled'&&b.cancelledAt?`<span class="note">Đã hủy ${new Date(b.cancelledAt).toLocaleString('vi-VN')}</span>`:''}</div>`,`<button class="btn" data-action="close-modal">Đóng</button><span class="spacer"></span><button class="btn" data-action="edit-booking" data-id="${b.id}">${ico('edit')} Chỉnh sửa / chuyển bàn</button>`);document.querySelector('[data-detail-checkin]')?.addEventListener('click',()=>checkIn(b.id));document.querySelector('[data-complete]')?.addEventListener('click',()=>completeBooking(b.id));document.querySelector('[data-cancel-booking]')?.addEventListener('click',()=>cancelBooking(b.id));document.querySelector('[data-action="edit-booking"]').addEventListener('click',()=>openBooking(b.id));updateElapsed()}
    function splitGroup(table){if(!state.canManageData)return;const group=state.groups.find(g=>g.includes(table));if(!group)return;state.groups=state.groups.filter(g=>g!==group);audit('Tách bàn',group.join(' + '));save();closeModal();render();toast(`Đã tách ${group.join(' + ')}`)}
    function mergeSelected(){if(!state.canManageData)return;if(state.selectedTables.length<2){toast('Chọn ít nhất hai bàn để ghép');return}const ids=[...new Set(state.selectedTables.flatMap(tableId=>state.groups.find(group=>group.includes(tableId))||[tableId]))];state.groups=state.groups.filter(group=>!group.some(tableId=>ids.includes(tableId)));state.groups.push(ids);audit('Ghép bàn',ids.join(' + '));state.mergeMode=false;state.selectedTables=[];save();render();toast(`Đã ghép ${ids.join(' + ')}`)}
    function exportCsv(){const rows=state.bookings.filter(b=>dateInRange(b.date));const csv=[['Ngày','Giờ','Tên khách','Điện thoại','Số khách','Bàn','Tiền cọc','Trạng thái','Ghi chú'],...rows.map(b=>[b.date,b.time,b.name,b.phone,b.guests,b.tableIds.join(' + '),b.deposit,statusNames[b.status],b.note])].map(row=>row.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`ganh-keo-booking-${state.dateFrom}-${state.dateTo}.csv`;a.click();URL.revokeObjectURL(a.href)}
    function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.addEventListener('click',()=>{state.page=x.dataset.page;render()}));document.querySelector('[data-date-from]')?.addEventListener('change',e=>{state.dateFrom=e.target.value; if(state.dateFrom>state.dateTo) state.dateTo=state.dateFrom; state.date=state.dateFrom; render()});document.querySelector('[data-date-to]')?.addEventListener('change',e=>{state.dateTo=e.target.value; if(state.dateTo<state.dateFrom) state.dateFrom=state.dateTo; state.date=state.dateTo; render()});document.querySelectorAll('[data-floor]').forEach(x=>x.addEventListener('click',()=>{state.floor=x.dataset.floor;render()}));document.querySelector('[data-action="theme"]')?.addEventListener('click',toggleTheme);document.querySelector('[data-action="new-booking"]')?.addEventListener('click',()=>openBooking());document.querySelector('[data-action="new-walk-in-global"]')?.addEventListener('click',()=>openWalkIn());document.querySelector('[data-search]')?.addEventListener('input',e=>{state.search=e.target.value;const cursor=e.target.selectionStart;const value=e.target.value;const wrap=e.target.closest('.panel');const tbody=wrap.querySelector('tbody');const temp=document.createElement('div');temp.innerHTML=bookingTable();const newBody=temp.querySelector('tbody');tbody.innerHTML=newBody.innerHTML;tbody.querySelectorAll('[data-booking]').forEach(row=>row.addEventListener('click',()=>openBookingDetail(row.dataset.booking)));const inp=document.querySelector('[data-search]');inp.focus();inp.setSelectionRange(cursor,cursor)});document.querySelector('[data-status-filter]')?.addEventListener('change',e=>{state.statusFilter=e.target.value;render()});document.querySelector('[data-customer-search]')?.addEventListener('input',e=>{state.customerSearch=e.target.value;const cursor=e.target.selectionStart;render();const input=document.querySelector('[data-customer-search]');input.focus();input.setSelectionRange(cursor,cursor)});document.querySelectorAll('[data-customer-phone]').forEach(x=>x.addEventListener('click',()=>customerHistory(x.dataset.customerPhone)));document.querySelectorAll('[data-walk-in-history]').forEach(x=>x.addEventListener('click',()=>walkInHistory(x.dataset.walkInHistory)));document.querySelectorAll('[data-booking]').forEach(x=>x.addEventListener('click',e=>{if(e.target.closest('[draggable="true"]'))return;openBookingDetail(x.dataset.booking)}));document.querySelectorAll('[data-action="merge-mode"]').forEach(x=>x.addEventListener('click',()=>{state.mergeMode=true;state.selectedTables=[];render()}));document.querySelector('[data-action="cancel-merge"]')?.addEventListener('click',()=>{state.mergeMode=false;state.selectedTables=[];render()});document.querySelector('[data-action="confirm-merge"]')?.addEventListener('click',mergeSelected);document.querySelectorAll('[data-action="split-group"]').forEach(x=>x.addEventListener('click',()=>{const g=state.groups.find(g=>g.some(t=>floors.find(f=>f.id===state.floor)?.tables.includes(t)));if(!g){toast('Tầng này chưa có nhóm bàn ghép');return}splitGroup(g[0])}));document.querySelectorAll('[data-table]').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('[data-booking]'))return;if(state.mergeMode){const id=card.dataset.table;state.selectedTables=state.selectedTables.includes(id)?state.selectedTables.filter(x=>x!==id):[...state.selectedTables,id];card.style.outline=state.selectedTables.includes(id)?'2px solid var(--green)':'';document.querySelector('[data-action="confirm-merge"]').innerHTML=`${ico('merge')} Xác nhận ghép (${state.selectedTables.length})`;return}openTable(card.dataset.table)});card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drop-over')});card.addEventListener('dragleave',()=>card.classList.remove('drop-over'));card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drop-over');const id=e.dataTransfer.getData('text/booking');if(id)moveBooking(id,card.dataset.table)})});document.querySelectorAll('[draggable="true"]').forEach(x=>x.addEventListener('dragstart',e=>e.dataTransfer.setData('text/booking',x.dataset.booking)));document.querySelectorAll('[data-report]').forEach(x=>x.addEventListener('click',()=>{state.reportMode=x.dataset.report;render()}));document.querySelector('[data-report-year]')?.addEventListener('change',e=>{const year=Math.max(2020,Math.min(2100,+e.target.value||2026));state.date=`${year}${state.date.slice(4)}`;render()});document.querySelector('[data-setting-theme]')?.addEventListener('change',toggleTheme);document.querySelector('[data-action="reset-data"]')?.addEventListener('click',()=>{if(!confirm('Xóa toàn bộ booking, lịch sử và nhóm bàn trên thiết bị này?'))return;state.bookings=[];state.history=[];state.groups=[];save();render();toast('Đã xóa dữ liệu trên thiết bị')});document.querySelector('[data-action="clear-history"]')?.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();clearHistory()});document.querySelector('[data-action="export"]')?.addEventListener('click',exportCsv);document.querySelector('[data-action="alerts"]')?.addEventListener('click',()=>{const late=dayBookings().filter(b=>['confirmed','deposit'].includes(b.status)&&b.time<new Date().toTimeString().slice(0,5));toast(late.length?`${late.length} booking chưa check-in đã qua giờ dự kiến`:'Không có booking quá giờ chưa check-in')});document.querySelectorAll('[data-action="close-modal"]').forEach(x=>x.addEventListener('click',closeModal));document.querySelectorAll('[data-action="backdrop-close"]').forEach(x=>x.addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()}));document.querySelector('[data-action="new-at-table"]')?.addEventListener('click',e=>openBooking(null,[e.currentTarget.dataset.tableId]));document.querySelector('[data-action="save-booking"]')?.addEventListener('click',saveBooking);document.querySelector('[data-action="edit-booking"]')?.addEventListener('click',e=>openBooking(e.currentTarget.dataset.id));document.querySelector('[data-detail-checkin]')?.addEventListener('click',e=>checkIn(e.currentTarget.dataset.detailCheckin));document.querySelector('[data-complete]')?.addEventListener('click',e=>completeBooking(e.currentTarget.dataset.complete));document.querySelector('[data-action="split-this"]')?.addEventListener('click',e=>splitGroup(e.currentTarget.dataset.tableId));updateElapsed()}
    function moveBooking(id,table){const b=state.bookings.find(x=>x.id===id);if(!b||b.tableIds.includes(table))return;b.tableIds=[table];audit('Chuyển bàn bằng kéo thả',`${b.name} · ${table}`);save();render();toast(`Đã chuyển ${b.name} sang ${table}`)}
    function moveWalkIn(id,table){const walkIn=state.walkIns.find(item=>item.id===id&&item.status==='arrived');if(!walkIn||walkIn.tableIds.includes(table))return;const bookingConflict=state.bookings.some(booking=>booking.date===walkIn.date&&booking.time===walkIn.time&&booking.tableIds.includes(table)&&!['cancelled','completed','no-show'].includes(booking.status));if(bookingConflict){toast(`Bàn ${table} đã có booking lúc ${walkIn.time}`);return}const oldTable=walkIn.tableIds.join(' + ');walkIn.tableIds=[table];audit('Chuyển khách lẻ bằng kéo thả',`${walkIn.customerName||'Khách lẻ'} · ${oldTable} → ${table}`);save();render();toast(`Đã chuyển khách lẻ sang ${table}`)}
    function customerHistory(phone){const rows=state.bookings.filter(b=>b.phone===phone&&dateInRange(b.date)).sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));const c=rows[0];modal(`Lịch sử · ${esc(c?.name||'Khách hàng')}`,`${esc(phone)} · ${rows.length} lượt đặt trong khoảng ngày`,rows.map(b=>`<div class="booking-row" data-booking="${b.id}"><div class="time-mark">${b.time}</div><div class="booking-info"><strong>${dateLabel(b.date,{day:'numeric',month:'short',year:'numeric'})} · ${displayTables(b)}</strong><small>${b.guests} khách · cọc ${money(b.deposit)}</small></div>${statusTag(b.status)}</div>`).join('')||'<div class="empty-state">Chưa có lịch sử khách trong khoảng ngày này.</div>','<button class="btn" data-action="close-modal">Đóng</button>',true);document.querySelectorAll('[data-booking]').forEach(x=>x.addEventListener('click',()=>openBookingDetail(x.dataset.booking)))}
    function walkInHistory(){
      const rows=state.walkIns.filter(walkIn=>dateInRange(walkIn.date)).sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
      const renderRows=items=>items.map(walkIn=>`<div class="booking-row" data-walk-in-id="${walkIn.id}"><div class="time-mark">${walkIn.time}</div><div class="booking-info"><strong>${esc(walkIn.customerName||'Khách lẻ')} · ${dateLabel(walkIn.date,{day:'numeric',month:'short',year:'numeric'})} · Bàn ${walkIn.tableIds.map(esc).join(' + ')}</strong><small>${walkIn.guests} khách · ${walkIn.status==='arrived'?'Đang sử dụng':'Đã hoàn tất'}</small></div>${statusTag(walkIn.status)}</div>`).join('');
      const searchMarkup='<label class="toolbar-search" style="width:100%;margin-bottom:10px">'+ico('search')+'<input data-walk-in-search placeholder="Tìm tên, ngày, giờ, bàn hoặc số khách" aria-label="Tìm lịch sử khách lẻ"></label>';
      const listMarkup=renderRows(rows)||'<div class="empty-state">Chưa có lịch sử khách lẻ trong khoảng ngày này.</div>';
      modal('Lịch sử · Khách lẻ',`${rows.length} lượt khách lẻ trong khoảng ngày`,`${searchMarkup}<div data-walk-in-results>${listMarkup}</div>`,'<button class="btn" data-action="close-modal">Đóng</button>',true);
      const results=document.querySelector('[data-walk-in-results]');
      const bindRows=()=>results.querySelectorAll('[data-walk-in-id]').forEach(row=>row.addEventListener('click',()=>openWalkInDetail(row.dataset.walkInId)));
      bindRows();
      document.querySelector('[data-walk-in-search]').addEventListener('input',event=>{
        const query=event.target.value.trim().toLocaleLowerCase('vi');
        const filtered=rows.filter(walkIn=>`${walkIn.customerName||'Khách lẻ'} ${walkIn.date} ${dateLabel(walkIn.date,{day:'numeric',month:'short',year:'numeric'})} ${walkIn.time} ${walkIn.tableIds.join(' ')} ${walkIn.guests}`.toLocaleLowerCase('vi').includes(query));
        results.innerHTML=renderRows(filtered)||'<div class="empty-state">Không tìm thấy lượt khách phù hợp.</div>';
        bindRows();
      });
    }
    function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;localStorage.setItem('gk-theme',state.theme);render()}
    function updateElapsed(){document.querySelectorAll('[data-elapsed]').forEach(el=>{const seconds=Math.max(0,Math.floor((Date.now()-new Date(el.dataset.elapsed).getTime())/1000));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;el.textContent=`${h?`${h} giờ `:''}${String(m).padStart(2,'0')} phút ${String(s).padStart(2,'0')} giây`})}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    document.addEventListener('dragstart',e=>{const slot=e.target.closest('.table-card .walk-in-slot[data-walk-in]');if(slot)e.dataTransfer.setData('text/walk-in',slot.dataset.walkIn)});
    document.addEventListener('drop',e=>{const card=e.target.closest('.table-card[data-table]'),id=e.dataTransfer.getData('text/walk-in');if(card&&id)moveWalkIn(id,card.dataset.table)});
    document.addEventListener('click',e=>{const walkInSlot=e.target.closest('.table-card .slot[data-walk-in]');if(walkInSlot?.isConnected){openWalkInDetail(walkInSlot.dataset.walkIn);return}const slot=e.target.closest('.table-card .slot[data-booking]');if(slot?.isConnected){openTable(slot.closest('[data-table]').dataset.table);return}const row=e.target.closest('tr[data-booking],.modal .booking-row[data-booking]');if(row?.isConnected)openBookingDetail(row.dataset.booking)});
    window.addEventListener('focus',()=>void refreshSharedData());
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void refreshSharedData()});
    startApp();setInterval(updateElapsed,1000);setInterval(()=>void refreshSharedData(),5000);
  </script>
