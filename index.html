    .confirm-backdrop{position:fixed;inset:0;z-index:30;background:#1019139c;display:grid;place-items:center;padding:18px;animation:rise .16s ease}.confirm-dialog{width:min(440px,100%);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px}.confirm-heading{display:flex;align-items:flex-start;gap:12px}.confirm-symbol{width:40px;height:40px;display:grid;place-items:center;flex:none;border-radius:10px;background:var(--red-bg);color:var(--red)}.confirm-symbol svg{width:19px;height:19px}.confirm-title{font:600 20px/1.2 "Playfair Display",serif;margin:1px 0 0}.confirm-kicker{color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:4px}.confirm-copy{font-size:12px;color:var(--muted);margin:14px 0}.confirm-details{display:grid;gap:8px;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px}.confirm-detail{display:grid;grid-template-columns:75px minmax(0,1fr);gap:8px;font-size:11px}.confirm-detail span{color:var(--muted)}.confirm-detail strong{overflow-wrap:anywhere}.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
  </style>
  <style>.confirm-symbol.success{background:var(--green-2);color:var(--green)}</style>
  <style>
    .settings-grid>.panel:nth-child(2) .panel-head{background:var(--green-2)}.settings-grid>.panel:nth-child(2) .panel-title:before{content:"";display:inline-block;width:7px;height:7px;margin:0 8px 1px 0;border-radius:50%;background:var(--green);vertical-align:middle}.settings-grid>.panel:nth-child(2) .panel-body{padding:12px}.settings-grid>.panel:nth-child(2) .setting-row{min-height:57px}.settings-grid>.panel:nth-child(2) .setting-row>div{min-width:0}.settings-grid>.panel:nth-child(2) .setting-row:last-child{min-height:68px;margin-top:8px;padding:11px 12px;background:var(--red-bg);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px}.settings-grid>.panel:nth-child(2) .setting-row:last-child strong{color:var(--red)}.settings-grid>.panel:nth-child(2) .setting-row:last-child .btn{background:var(--paper);border-color:transparent}
    @media(max-width:700px){.settings-grid>.panel:nth-child(2) .setting-row:last-child{align-items:flex-start}.settings-grid>.panel:nth-child(2) .setting-row:last-child .btn{flex:none}}

  <style>
    :root{--bg:#f6f4ef;--paper:#fffdfa;--ink:#2c2420;--muted:#786f68;--line:#e7ded5;--green:#35745d;--green-2:#e5eee8;--lime:#e7ba42;--amber:#a97724;--amber-bg:#fbf1dc;--red:#ae4638;--red-bg:#f7e8e3;--blue:#52788a;--blue-bg:#e8f0f3;--brand-gold:#e7ba42;--brand-soft:#f4ecd7;--brand-ink:#30241c;--shadow:0 14px 36px #30241c14}
    [data-theme="dark"]{--bg:#1c1b1a;--paper:#262422;--ink:#f2ece3;--muted:#ada59b;--line:#3c3834;--green:#8fc2a3;--green-2:#2d3931;--lime:#efc34f;--amber:#e7b957;--amber-bg:#3a3326;--red:#e28676;--red-bg:#3b2926;--blue:#91bdc9;--blue-bg:#29383b;--brand-gold:#edc44e;--brand-soft:#39301f;--brand-ink:#2a2119;--shadow:0 14px 36px #0004}
    body{background:var(--bg);transition:background-color .22s,color .22s}button,.nav-btn,.floor-tab,.table-card,.panel{transition:background-color .18s,border-color .18s,color .18s,box-shadow .18s,transform .18s}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline-color:var(--brand-gold)}.sidebar{background:#29211e}.nav-btn.active{position:relative;background:#433128;color:#fff5e4}.sidebar .nav-btn.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-gold)}.sidebar .nav-btn.active svg{color:var(--brand-gold)}.nav-count{background:var(--brand-gold);color:var(--brand-ink)}.brand img{border:1px solid var(--brand-gold);box-shadow:0 0 0 2px #e7ba4238,0 4px 12px #0003}.btn.primary{background:var(--brand-gold);border-color:var(--brand-gold);color:var(--brand-ink)}.btn.primary:hover{background:var(--brand-gold);filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 5px 14px #e7ba4238}.floor-tab.active{background:var(--brand-gold);color:var(--brand-ink)}.mobile-nav .nav-btn.active{background:var(--brand-soft);color:var(--brand-ink)}.mobile-nav .nav-btn.active svg{color:var(--brand-ink)}
    @media(max-width:700px){.mobile-nav .nav-btn{width:auto;flex:1 1 0;min-width:0}.mobile-nav .nav-btn span:not(.nav-count){white-space:nowrap;font-size:8px}}
  </style>
  <style>
    :root{--muted:#62574e}
    [data-theme="dark"]{--muted:#d1c7ba}
    .page-sub,.panel-note,.note,.zone,.table-empty,.customer-meta,.stat-top,.booking-info small:not(.elapsed),.floor-section-head span,.floor-summary small,.table-pick-floor-head span,.table-pick-area-head span:last-child{color:var(--muted);font-weight:500}
    .zone,.table-empty{font-size:10px}
    [data-theme="dark"] .slot:not(.arrived):not(.hold):not(.completed){background:#493c23;color:#ffe2a0}
    [data-theme="dark"] .slot.arrived{background:#2d4335;color:#c4e8cb}
    [data-theme="dark"] .slot.hold{background:#2c4045;color:#c5e4e8}
    [data-theme="dark"] .slot.completed{background:#373330;color:#d1c7ba}
    [data-theme="dark"] .status.confirmed{background:#493c23;color:#ffe2a0}
    [data-theme="dark"] .status.deposit,[data-theme="dark"] .status.arrived{background:#2d4335;color:#c4e8cb}
    [data-theme="dark"] .status.hold{background:#2c4045;color:#c5e4e8}
    [data-theme="dark"] .status.completed{background:#373330;color:#d1c7ba}
    [data-theme="dark"] .status.cancelled,[data-theme="dark"] .status.no-show{background:#49312e;color:#ffd0c7}
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    const icon=(name)=>({grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15m6-12v15"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v13A2.5 2.5 0 0 1 6.5 16H20"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 9h18M16 14h2"/><path d="M7 5V3h12"/>',chart:'<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',moon:'<path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',close:'<path d="m18 6-12 12M6 6l12 12"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chevron:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M7 17 17 7M7 7h10v10"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>',merge:'<path d="M8 3v3a4 4 0 0 0 4 4h4"/><path d="m13 7 3 3-3 3"/><path d="M8 21v-3a4 4 0 0 1 4-4h4"/><path d="m13 11 3 3-3 3"/>',check:'<path d="m5 12 4 4L19 6"/>',filter:'<path d="M4 6h16M7 12h10m-7 6h4"/>',download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6"/><path d="M10 11v5m4-5v5"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 2.7a2 2 0 0 1-.6 1.8L7.7 9.5a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 1.8-.6l2.7.5a2 2 0 0 1 1.7 2.8Z"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2.6L20 12M4 12l2.8 5.6A7 7 0 0 0 18.4 15"/>'})[name]||'';
    const ico=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icon(name)}</svg>`;
    const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const floors=[{id:'ground',name:'Trệt',tables:Array.from({length:8},(_,i)=>`T${String(i+1).padStart(2,'0')}`),zones:{}},{id:'first',name:'Lầu 1',tables:Array.from({length:12},(_,i)=>`L1${String(i+1).padStart(2,'0')}`),zones:{L101:'View sông',L102:'View sông',L103:'View sông',L104:'View sông',L105:'View sông',L106:'Bên trong',L107:'Bên trong',L108:'Bên trong',L109:'Bên trong',L110:'Bên trong',L111:'Bên trong góc',L112:'Bên trong góc'}},{id:'second',name:'Lầu 2',tables:Array.from({length:5},(_,i)=>`L2${String(i+1).padStart(2,'0')}`),zones:{L201:'View sông',L202:'View sông',L203:'View sông',L204:'Bên trong góc',L205:'Bên trong góc'}},{id:'roof',name:'Sân thượng',tables:Array.from({length:15},(_,i)=>`ST${String(i+1).padStart(2,'0')}`),zones:Object.fromEntries([...Array.from({length:7},(_,i)=>[`ST${String(i+1).padStart(2,'0')}`,'View sông']),...Array.from({length:8},(_,i)=>[`ST${String(i+8).padStart(2,'0')}`,'Bên trong'])])}];
    const allTables=floors.flatMap(f=>f.tables.map(id=>({id,floor:f.name,zone:f.zones[id]||'Khu vực chung'})));
    const statusNames={confirmed:'Đã xác nhận',deposit:'Đã cọc',arrived:'Đã đến',completed:'Hoàn tất',cancelled:'Đã hủy',hold:'Tạm giữ','no-show':'Không đến'};
    const demoBookings=()=>{const d=today();return [{id:'demo1',name:'Nguyễn Minh Anh',phone:'0903 218 416',guests:4,date:d,time:'12:00',tableIds:['T01'],deposit:500000,note:'Khách lẻ · thích ngồi gần cửa sổ',status:'deposit',created:new Date().toISOString()},{id:'demo2',name:'Trần Quốc Bảo',phone:'0918 764 220',guests:6,date:d,time:'18:30',tableIds:['L101','L102'],deposit:1000000,note:'Sinh nhật, chuẩn bị bánh nhỏ',status:'confirmed',created:new Date().toISOString()},{id:'demo3',name:'Lê Thu Hà',phone:'0987 331 506',guests:2,date:d,time:'19:00',tableIds:['ST01'],deposit:0,note:'',status:'arrived',checkIn:new Date(Date.now()-24*60000).toISOString(),created:new Date().toISOString()},{id:'demo4',name:'Phạm Gia Huy',phone:'0935 602 147',guests:3,date:d,time:'20:00',tableIds:['L204'],deposit:300000,note:'Bên trong góc, khách quen',status:'confirmed',created:new Date().toISOString()},{id:'demo5',name:'Võ Ngọc Lan',phone:'0908 195 477',guests:5,date:d,time:'20:30',tableIds:['ST08'],deposit:500000,note:'',status:'deposit',created:new Date().toISOString()}]};
    const load=(key,fallback)=>{try{const x=localStorage.getItem(key);return x?JSON.parse(x):fallback}catch{return fallback}};
    const state={page:'overview',date:today(),floor:'ground',theme:localStorage.getItem('gk-theme')||'light',bookings:load('gk-bookings',null)||demoBookings(),history:load('gk-history',[]),groups:load('gk-groups',[]),role:localStorage.getItem('gk-role')||'Quản lý',modal:null,search:'',statusFilter:'all',reportMode:'month',mergeMode:false,selectedTables:[],customerSearch:'',month:today().slice(0,7)};
    document.documentElement.dataset.theme=state.theme;
    const save=()=>{localStorage.setItem('gk-bookings',JSON.stringify(state.bookings));localStorage.setItem('gk-history',JSON.stringify(state.history));localStorage.setItem('gk-groups',JSON.stringify(state.groups))};
    const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+' ₫';
    const dateLabel=(d,opts={weekday:'long',day:'numeric',month:'long',year:'numeric'})=>new Intl.DateTimeFormat('vi-VN',opts).format(new Date(d+'T12:00:00'));
    const statusTag=s=>`<span class="status ${esc(s)}">${statusNames[s]||s}</span>`;
    const displayTables=b=>b.tableIds.map(t=>esc(t)).join(' + ');
    const dayBookings=()=>state.bookings.filter(b=>b.date===state.date&&b.status!=='cancelled'&&b.status!=='completed'&&b.status!=='no-show').sort((a,b)=>a.time.localeCompare(b.time));
    const bookingsForTable=(id)=>state.bookings.filter(b=>b.date===state.date&&b.tableIds.includes(id)&&!['cancelled','completed','no-show'].includes(b.status)).sort((a,b)=>a.time.localeCompare(b.time));
    const navItems=[['overview','Tổng quan','grid'],['map','Sơ đồ bàn','map'],['bookings','Booking','book'],['customers','Khách hàng','users'],['deposits','Tiền cọc','wallet'],['reports','Báo cáo','chart'],['history','Lịch sử','history'],['settings','Cài đặt','settings']];
    function navButton(item){return `<button class="nav-btn ${state.page===item[0]?'active':''}" data-page="${item[0]}">${ico(item[2])}<span>${item[1]}</span>${item[0]==='bookings'&&dayBookings().length?`<span class="nav-count">${dayBookings().length}</span>`:''}</button>`}
    function shell(){return `<aside class="sidebar"><div class="brand"><img src="http://www.ganhkeone.com/thumbnail/192x192x1/upload/photo/thiet-ke-chua-co-ten-31-2291.png" alt="Logo Gánh Kèo" onerror="this.style.display='none'"><div><div class="brand-name">Nhà Hàng<br>Gánh Kèo</div><div class="brand-sub">Đặt bàn & vận hành</div></div></div><div class="nav-label">Không gian làm việc</div><nav class="nav">${navItems.map(navButton).join('')}</nav><div class="side-bottom"><div class="staff"><div class="avatar">${state.role==='Quản lý'?'QL':'NV'}</div><div><strong>${state.role}</strong><small>Đang hoạt động</small></div><span class="role-tag">ONLINE</span></div></div></aside><main class="main"><header class="topbar"><div class="crumb">Gánh Kèo <span style="color:var(--line);padding:0 7px">/</span> <strong>${navItems.find(i=>i[0]===state.page)?.[1]||'Tổng quan'}</strong></div><div class="top-actions"><span class="demo-chip">Lưu tự động trên thiết bị</span><input class="top-date" type="date" aria-label="Ngày xem" value="${state.date}" data-date><button class="icon-btn" data-action="theme" title="Đổi giao diện" aria-label="Đổi giao diện">${ico(state.theme==='dark'?'sun':'moon')}</button><button class="icon-btn" data-action="alerts" title="Cảnh báo" aria-label="Cảnh báo">${ico('bell')}</button></div></header><section class="content" id="content"></section></main><nav class="mobile-nav">${[['overview','Tổng quan','grid'],['map','Sơ đồ bàn','map'],['bookings','Booking','book'],['customers','Khách hàng','users'],['reports','Báo cáo','chart']].map(navButton).join('')}</nav><div id="modal-root"></div><div id="toast-root"></div>`}
    function pageHead(eyebrow,title,sub,actions=''){const heading=state.page==='overview'?`${new Intl.DateTimeFormat('vi-VN',{weekday:'long'}).format(new Date(state.date+'T12:00:00'))} · ${dateLabel(state.date,{day:'numeric',month:'long',year:'numeric'})}`:eyebrow;return `<div class="page-head"><div><div class="eyebrow">${heading}</div><h1 class="page-title">${title}</h1><div class="page-sub">${sub}</div></div><div class="head-actions">${actions}</div></div>`}
    const newButton=(label='Tạo booking mới')=>`<button class="btn primary" data-action="new-booking">${ico('plus')}${label}</button>`;
    function statsMarkup(items){return `<div class="stats">${items.map(x=>`<div class="stat"><div class="stat-top"><span>${x.label}</span><span class="stat-icon">${ico(x.icon)}</span></div><div class="stat-value">${x.value}</div><div class="stat-foot">${x.note||''}</div></div>`).join('')}</div>`}
    function overview(){const list=dayBookings(),arrived=list.filter(b=>b.status==='arrived').length,dep=list.reduce((s,b)=>s+(+b.deposit||0),0),due=list.filter(b=>['confirmed','deposit','hold'].includes(b.status));const floorsStats=floors.map(f=>({name:f.name,all:f.tables.length,busy:f.tables.filter(t=>bookingsForTable(t).length).length}));const actions=newButton()+`<button class="btn secondary-label" data-page="map">${ico('map')} Sơ đồ bàn</button>`;return `${pageHead(`Chủ nhật · ${dateLabel(state.date,{day:'numeric',month:'long',year:'numeric'})}`,'Tổng quan',dateLabel(state.date),actions)}${statsMarkup([{label:'Booking trong ngày',value:list.length,icon:'book',note:`${list.filter(b=>b.status==='confirmed'||b.status==='deposit').length} khách dự kiến`},{label:'Khách đang dùng bàn',value:arrived,icon:'users',note:'Đang tính giờ từ lúc check-in'},{label:'Tiền cọc đã nhận',value:money(dep),icon:'wallet',note:'Tổng cọc của ngày đã chọn'},{label:'Chưa check-in',value:due.length,icon:'clock',note:'Theo dõi giờ khách dự kiến đến'}])}<div class="grid-main"><section class="panel"><div class="panel-head"><div><div class="panel-title">Lịch khách hôm nay</div><div class="panel-note">${dateLabel(state.date)}</div></div><button class="btn small" data-page="bookings">Tất cả booking ${ico('chevron')}</button></div><div class="panel-body today-list">${list.length?list.map(b=>`<div class="booking-row" data-booking="${b.id}"><div class="time-mark">${esc(b.time)}<span></span></div><div class="booking-info"><strong>${esc(b.name)}</strong><small>${esc(b.guests)} khách · ${esc(b.phone)}</small></div><span class="table-tag">${displayTables(b)}</span>${statusTag(b.status)}</div>`).join(''):`<div class="empty-state">${ico('book')}Chưa có booking cho ngày này.<br>Tạo booking đầu tiên để bắt đầu.</div>`}</div></section><div style="display:grid;gap:14px;align-content:start"><section class="panel"><div class="panel-head"><div><div class="panel-title">Tình trạng các tầng</div><div class="panel-note">${allTables.length} bàn · không giới hạn lượt đặt theo ngày</div></div><button class="icon-btn" data-page="map" title="Mở sơ đồ">${ico('arrow')}</button></div><div class="panel-body floor-stack">${floorsStats.map(f=>`<div class="floor-summary"><div><strong>${f.name}</strong><small>${f.busy} bàn có lịch · ${f.all-f.busy} bàn trống lịch</small></div><div class="floor-count">${f.busy}<span style="font:400 11px 'DM Sans',sans-serif;color:var(--muted)">/${f.all}</span></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Cần theo dõi</div><div class="panel-note">Nhắc việc trong ngày</div></div></div><div class="panel-body">${list.filter(b=>['confirmed','deposit','hold'].includes(b.status)).slice(0,3).map(b=>`<div class="alert-line"><span class="alert-dot"></span><div><strong>${esc(b.time)} · ${esc(b.name)}</strong><small>${b.status==='hold'?'Bàn đang tạm giữ':`Chưa check-in · ${displayTables(b)}`}</small></div></div>`).join('')||'<div class="note">Không có nhắc việc mới.</div>'}</div></section></div></div>`}
    function tableCard(id){const items=bookingsForTable(id),group=state.groups.find(g=>g.includes(id));let cls='';if(items.some(b=>b.status==='arrived'))cls='has-arrived';else if(items.some(b=>b.status==='hold'))cls='is-hold';else if(items.length)cls='has-booking';return `<article class="table-card ${cls} ${group?'merged':''}" data-table="${id}" ${state.mergeMode?'data-merge-select="true"':''} tabindex="0"><div class="table-top"><span class="table-id">${id}</span><div class="table-top-right"><span class="zone">${allTables.find(t=>t.id===id)?.zone}</span><button type="button" class="table-add" data-add-booking="${id}" title="Thêm booking bàn ${id}" aria-label="Thêm booking bàn ${id}">${ico('plus')}</button></div></div>${group?`<span class="merged-mark">GHÉP ${group.length} BÀN</span>`:''}<div class="slot-list">${items.length?items.slice(0,2).map(b=>`<div draggable="true" class="slot ${b.status}" data-booking="${b.id}" title="${esc(b.name)} · ${esc(b.time)}">${esc(b.time)} · ${esc(b.name.split(' ').slice(-2).join(' '))}</div>`).join('')+(items.length>2?`<span class="slot-more">+${items.length-2} lượt đặt khác</span>`:''):`<div class="table-empty">Chưa có lịch đặt</div>`}</div></article>`}
    function mapPage(){const floor=floors.find(f=>f.id===state.floor);const areas=[...new Set(floor.tables.map(id=>floor.zones[id]||'Khu vực chung'))].map(name=>({name,tables:floor.tables.filter(id=>(floor.zones[id]||'Khu vực chung')===name)}));const areaClass=name=>name==='View sông'?'river':name.includes('góc')?'corner':name==='Bên trong'?'inside':'common';const filterState=state.mergeMode?`<span class="note">Chọn ít nhất 2 bàn rồi xác nhận ghép.</span><button class="btn small" data-action="confirm-merge">${ico('merge')} Xác nhận ghép (${state.selectedTables.length})</button><button class="btn small" data-action="cancel-merge">Hủy</button>`:`<button class="btn" data-action="merge-mode">${ico('merge')} Ghép bàn</button><button class="btn" data-action="split-group">Tách bàn</button>`;return `${pageHead('Sơ đồ vận hành','Sơ đồ bàn',`${allTables.length} bàn · chạm bàn để xem các lượt đặt trong ngày`,newButton())}<div class="map-toolbar"><div class="floor-tabs">${floors.map(f=>`<button class="floor-tab ${state.floor===f.id?'active':''}" data-floor="${f.id}">${f.name}<span style="opacity:.75;margin-left:5px">${f.tables.length}</span></button>`).join('')}</div><div class="spacer"></div>${filterState}<div class="map-legend"><span class="legend-item"><i class="legend-dot"></i>Trống lịch</span><span class="legend-item"><i class="legend-dot booked"></i>Đã đặt</span><span class="legend-item"><i class="legend-dot arrived"></i>Đã đến</span><span class="legend-item"><i class="legend-dot hold"></i>Tạm giữ</span></div></div><section class="floor-section"><div class="floor-section-head"><strong>${floor.name}</strong><span>${floor.tables.length} bàn · kéo booking sang bàn để chuyển</span></div>${areas.map(area=>`<section class="zone-group ${areaClass(area.name)}"><div class="zone-group-head"><i class="zone-marker"></i><strong class="zone-group-title">${area.name}</strong><span class="zone-group-count">${area.tables.length} bàn</span></div><div class="table-grid">${area.tables.map(tableCard).join('')}</div></section>`).join('')}</section><p class="note">Mỗi bàn có thể nhận nhiều booking ở các khung giờ khác nhau. Thời gian sử dụng chỉ bắt đầu tính sau khi check-in và không ấn định trước thời lượng.</p>`}
    function bookingTable(){let rows=state.bookings.filter(b=>b.date===state.date);if(state.statusFilter!=='all')rows=rows.filter(b=>b.status===state.statusFilter);if(state.search){const q=state.search.toLowerCase();rows=rows.filter(b=>b.name.toLowerCase().includes(q)||b.phone.includes(q)||b.tableIds.join(' ').toLowerCase().includes(q))}rows.sort((a,b)=>a.time.localeCompare(b.time));return `${pageHead('Lịch đặt','Booking',`${dateLabel(state.date)} · ${rows.length} lượt đặt`,newButton())}<div class="panel"><div class="panel-head"><div class="filters"><label class="toolbar-search">${ico('search')}<input data-search placeholder="Tên khách, số điện thoại, bàn" value="${esc(state.search)}"></label><select class="filter-select" data-status-filter><option value="all">Tất cả trạng thái</option>${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${state.statusFilter===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="btn small" data-action="export">${ico('download')} Xuất CSV</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Giờ</th><th>Khách</th><th>Liên hệ</th><th>Số khách</th><th>Bàn</th><th>Tiền cọc</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(b=>`<tr data-booking="${b.id}"><td><strong>${esc(b.time)}</strong></td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${b.guests}</td><td>${displayTables(b)}</td><td>${money(b.deposit)}</td><td>${statusTag(b.status)}</td></tr>`).join('')}</tbody></table>${rows.length?'':`<div class="empty-state">${ico('book')}Không có booking phù hợp cho ngày đã chọn.</div>`}</div></div>`}
    function customersPage(){const q=state.customerSearch.toLowerCase();const groups=Object.values(state.bookings.reduce((acc,b)=>{const key=b.phone||b.name;if(!acc[key])acc[key]={name:b.name,phone:b.phone,bookings:[],totalDeposit:0};acc[key].bookings.push(b);acc[key].totalDeposit+=(+b.deposit||0);return acc},{})).filter(c=>!q||c.phone.includes(q)||c.name.toLowerCase().includes(q));return `${pageHead('Hồ sơ khách','Khách hàng','Tra cứu bằng số điện thoại và xem lịch sử ghé thăm',newButton())}<section class="panel"><div class="panel-head"><div class="panel-title">${groups.length} hồ sơ khách</div><label class="toolbar-search">${ico('search')}<input data-customer-search placeholder="Tìm số điện thoại hoặc tên" value="${esc(state.customerSearch)}"></label></div><div>${groups.map(c=>`<div class="customer-card"><div class="customer-head"><div><strong>${esc(c.name)}</strong><div class="customer-meta">${esc(c.phone)} · ${c.bookings.length} lượt đặt · Cọc tích lũy ${money(c.totalDeposit)}</div></div><button class="btn small" data-customer-phone="${esc(c.phone)}">Xem lịch sử</button></div></div>`).join('')||'<div class="empty-state">Chưa có hồ sơ khách.</div>'}</div></section>`}
    function depositsPage(){const rows=state.bookings.filter(b=>b.date===state.date&&+b.deposit>0).sort((a,b)=>a.time.localeCompare(b.time));const sum=rows.reduce((n,b)=>n+(+b.deposit||0),0);return `${pageHead('Đối soát','Tiền cọc',`${dateLabel(state.date)} · ${rows.length} khoản cọc`,newButton())}${statsMarkup([{label:'Tổng tiền cọc',value:money(sum),icon:'wallet',note:'Theo ngày đang chọn'},{label:'Đã nhận cọc',value:rows.length,icon:'check',note:'Booking có ghi nhận tiền cọc'},{label:'Chưa đặt cọc',value:state.bookings.filter(b=>b.date===state.date&&b.status==='confirmed'&&!b.deposit).length,icon:'clock',note:'Cần theo dõi xác nhận'}])}<section class="panel"><div class="panel-head"><div class="panel-title">Chi tiết tiền cọc</div><span class="note">Cọc được ghi nhận trong từng booking</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Giờ</th><th>Khách</th><th>Số điện thoại</th><th>Bàn</th><th>Tiền cọc</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(b=>`<tr data-booking="${b.id}"><td>${b.time}</td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${displayTables(b)}</td><td><strong>${money(b.deposit)}</strong></td><td>${statusTag(b.status)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty-state">Ngày này chưa ghi nhận tiền cọc.</div>'}</div></section>`}
    function reportsPage(){const mode=state.reportMode,anchor=state.date.slice(0,4),labels=[],values=[];if(mode==='month'){for(let i=1;i<=12;i++){const m=`${anchor}-${String(i).padStart(2,'0')}`;labels.push(['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'][i-1]);values.push(state.bookings.filter(b=>b.date.startsWith(m)&&!['cancelled','no-show'].includes(b.status)).length)}}else if(mode==='year'){for(let i=anchor-4;i<=+anchor;i++){labels.push(String(i));values.push(state.bookings.filter(b=>b.date.startsWith(String(i))&&!['cancelled','no-show'].includes(b.status)).length)}}else{const d=new Date(state.date+'T12:00:00');const first=new Date(d);first.setDate(d.getDate()-6);for(let i=0;i<7;i++){const day=new Date(first);day.setDate(first.getDate()+i);const ds=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;labels.push(new Intl.DateTimeFormat('vi-VN',{weekday:'short'}).format(day));values.push(state.bookings.filter(b=>b.date===ds&&!['cancelled','no-show'].includes(b.status)).length)}}const total=values.reduce((a,b)=>a+b,0),max=Math.max(...values,1),comparison=mode==='month'?`Tổng booking năm ${anchor}`:mode==='year'?'Tổng booking theo năm':'Booking 7 ngày gần nhất';const accepted=state.bookings.filter(b=>!['cancelled','no-show'].includes(b.status));return `${pageHead('Phân tích hoạt động','Báo cáo',`So sánh booking theo ngày, tháng và năm`)}<div class="filters" style="margin-bottom:14px"><div class="floor-tabs"><button class="floor-tab ${mode==='week'?'active':''}" data-report="week">7 ngày</button><button class="floor-tab ${mode==='month'?'active':''}" data-report="month">Theo tháng</button><button class="floor-tab ${mode==='year'?'active':''}" data-report="year">Theo năm</button></div><label class="note">Năm tham chiếu: <input class="filter-select" type="number" min="2020" max="2100" value="${anchor}" data-report-year style="width:86px"></label></div><div class="report-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">${comparison}</div><div class="panel-note">Không tính booking đã hủy hoặc khách không đến</div></div></div><div class="panel-body"><div class="report-total">${total}<span style="font:400 12px 'DM Sans',sans-serif;color:var(--muted)"> booking</span></div><div class="bar-chart">${values.map((v,i)=>`<div class="bar-col"><span class="bar-value">${v||''}</span><div class="bar ${i===values.length-1?'current':''}" style="height:${Math.max(v/max*100,v?5:2)}%"></div><span class="bar-label">${labels[i]}</span></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Tổng hợp trạng thái</div><div class="panel-note">${accepted.length} booking hợp lệ toàn thời gian</div></div></div><div class="panel-body">${Object.entries(statusNames).map(([key,name])=>{const count=state.bookings.filter(b=>b.status===key).length;return `<div class="detail-line"><span>${statusTag(key)}</span><strong>${count}</strong></div>`}).join('')}<div class="detail-line"><span>Tiền cọc đã ghi nhận</span><strong>${money(state.bookings.reduce((s,b)=>s+(+b.deposit||0),0))}</strong></div></div></section></div>`}
    function historyPage(){const rows=[...state.history].reverse();return `${pageHead('Nhật ký hệ thống','Lịch sử','Theo dõi chỉnh sửa booking và thao tác bàn') }<section class="panel"><div class="panel-head"><div class="panel-title">${rows.length} hoạt động gần đây</div><button class="btn small" data-action="clear-history">Xóa lịch sử</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Thời gian</th><th>Nhân viên</th><th>Thao tác</th><th>Booking / bàn</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${new Date(h.at).toLocaleString('vi-VN')}</td><td>${esc(h.by)}</td><td>${esc(h.action)}</td><td>${esc(h.subject)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty-state">Thao tác chỉnh sửa sẽ được lưu tại đây.</div>'}</div></section>`}
    function settingsPage(){return `${pageHead('Thiết lập nhà hàng','Cài đặt','Tuỳ chỉnh giao diện, phân quyền và dữ liệu') }<div class="settings-grid"><section class="panel"><div class="panel-head"><div class="panel-title">Giao diện & thông báo</div></div><div class="panel-body"><div class="setting-row"><div><strong>Chế độ tối</strong><small>Đổi giao diện cho môi trường thiếu sáng</small></div><input type="checkbox" class="switch" data-setting-theme ${state.theme==='dark'?'checked':''}></div><div class="setting-row"><div><strong>Cảnh báo trùng giờ</strong><small>Nhắc khi một bàn có booking cùng ngày, cùng giờ</small></div><input type="checkbox" class="switch" data-setting-conflict checked></div><div class="setting-row"><div><strong>Nhắc booking chưa đến</strong><small>Hiện các booking chưa check-in trong ngày</small></div><input type="checkbox" class="switch" checked disabled></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Nhân sự & dữ liệu</div></div><div class="panel-body"><div class="setting-row"><div><strong>Vai trò hiện tại</strong><small>${state.role==='Quản lý'?'Toàn quyền thao tác và cài đặt':'Nhân viên · thao tác booking'}</small></div><select class="filter-select" data-role><option ${state.role==='Quản lý'?'selected':''}>Quản lý</option><option ${state.role==='Nhân viên'?'selected':''}>Nhân viên</option></select></div><div class="setting-row"><div><strong>Lưu trữ</strong><small>Dữ liệu lưu tự động trong trình duyệt này</small></div><span class="status arrived">Đang hoạt động</span></div><div class="setting-row"><div><strong>Dữ liệu booking</strong><small>${state.bookings.length} booking · ${state.history.length} dòng lịch sử</small></div><button class="btn small danger" data-action="reset-data">${ico('refresh')} Xóa dữ liệu</button></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Danh sách bàn</div></div><div class="panel-body"><div class="detail-line"><span>Trệt</span><strong>T01 – T08 · 8 bàn</strong></div><div class="detail-line"><span>Lầu 1</span><strong>L101 – L112 · 12 bàn</strong></div><div class="detail-line"><span>Lầu 2</span><strong>L201 – L205 · 5 bàn</strong></div><div class="detail-line"><span>Sân thượng</span><strong>ST01 – ST15 · 15 bàn</strong></div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Gợi ý vận hành</div></div><div class="panel-body"><p class="note">Để dữ liệu dùng chung giữa nhiều thiết bị và nhân viên, bản vận hành chính thức nên kết nối cơ sở dữ liệu và đăng nhập có phân quyền ở máy chủ. Bản hiện tại lưu trên thiết bị đang mở.</p><p class="note">Thời gian khách lưu trú được đếm từ lúc check-in đến khi hoàn tất booking; hệ thống không đặt sẵn thời lượng ngồi.</p></div></section></div>`}
    function render(){document.getElementById('app').innerHTML=shell();addMobileSettingsLink();const views={overview, map:mapPage,bookings:bookingTable,customers:customersPage,deposits:depositsPage,reports:reportsPage,history:historyPage,settings:settingsPage};document.getElementById('content').innerHTML=(views[state.page]||overview)();hideArrivedFromOverview();bind();bindResetDataConfirmation();enableTimeDrag();bindTableAddButtons();bindOverviewActions();}
    function bindResetDataConfirmation(){const button=document.querySelector('[data-action="reset-data"]');if(!button)return;button.addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();showConfirmation({title:'Xóa toàn bộ dữ liệu?',message:'Thao tác này không thể hoàn tác. Các booking, lịch sử và nhóm bàn trên thiết bị này sẽ bị xóa.',confirmLabel:'Xóa toàn bộ dữ liệu',iconName:'trash',details:[{label:'Booking',value:`${state.bookings.length} booking`},{label:'Lịch sử',value:`${state.history.length} dòng`},{label:'Nhóm bàn',value:`${state.groups.length} nhóm`},{label:'Lưu trữ',value:'Thiết bị này'}],onConfirm:()=>{state.bookings=[];state.history=[];state.groups=[];save();closeModal();render();toast('Đã xóa dữ liệu trên thiết bị')}})},true)}
    function addMobileSettingsLink(){const nav=document.querySelector('.mobile-nav');if(nav&&!nav.querySelector('[data-page="settings"]'))nav.insertAdjacentHTML('beforeend',navButton(navItems.find(item=>item[0]==='settings')))}
    function hideArrivedFromOverview(){if(state.page!=='overview')return;const list=document.querySelector('.today-list');if(!list)return;const arrived=dayBookings().filter(b=>b.status==='arrived');list.querySelectorAll('.booking-row[data-booking]').forEach(row=>{if(state.bookings.find(b=>b.id===row.dataset.booking)?.status==='arrived')row.remove()});if(!list.querySelector('.booking-row')&&state.bookings.some(b=>b.date===state.date&&!['cancelled','completed','no-show'].includes(b.status)))list.innerHTML='<div class="empty-state">Không còn booking chờ đến trong ngày này.</div>';const schedulePanel=list.closest('.panel'),grid=document.querySelector('.grid-main');if(!schedulePanel||!grid)return;let column=grid.querySelector('.overview-booking-column');if(!column){column=document.createElement('div');column.className='overview-booking-column';schedulePanel.replaceWith(column);column.append(schedulePanel)}column.querySelector('.overview-arrived-panel')?.remove();if(!arrived.length)return;const panel=document.createElement('section');panel.className='panel overview-arrived-panel';panel.innerHTML=`<div class="panel-head"><div><div class="panel-title">Đang phục vụ</div><div class="panel-note">${arrived.length} booking · bộ đếm tính từ lúc check-in</div></div></div><div class="panel-body arrived-list"></div>`;const body=panel.querySelector('.arrived-list');arrived.forEach(b=>{const row=document.createElement('div');row.className='booking-row overview-booking-row';row.dataset.booking=b.id;row.innerHTML=`<div class="time-mark">${esc(b.time)}</div><div class="booking-info"><strong>${esc(b.name)}</strong><small>${esc(b.guests)} khách · ${esc(b.phone)}</small><small class="elapsed" data-elapsed="${esc(b.checkIn||new Date().toISOString())}"></small></div><span class="table-tag">${displayTables(b)}</span>${statusTag(b.status)}<div class="overview-actions"><button type="button" class="btn soft small" aria-label="Hoàn tất ${esc(b.name)}">${ico('check')} Hoàn tất</button></div>`;row.q g" data-id="${b.id}">${ico('edit')} Chỉnh sửa / chuyển bàn</button>`);document.querySelector('[data-detail-checkin]')?.addEventListener('click',()=>checkIn(b.id));document.querySelector('[data-complete]')?.addEventListener('click',()=>completeBooking(b.id));document.querySelector('[data-cancel-booking]')?.addEventListener('click',()=>cancelBooking(b.id));document.querySelector('[data-action="edit-booking"]').addEventListener('click',()=>openBooking(b.id));updateElapsed()}
    function splitGroup(table){const group=state.groups.find(g=>g.includes(table));if(!group)return;state.groups=state.groups.filter(g=>g!==group);audit('Tách bàn',group.join(' + '));save();closeModal();render();toast(`Đã tách ${group.join(' + ')}`)}
    function mergeSelected(){if(state.selectedTables.length<2){toast('Chọn ít nhất hai bàn để ghép');return}const ids=[...state.selectedTables];state.groups=state.groups.filter(g=>!g.some(t=>ids.includes(t)));state.groups.push(ids);audit('Ghép bàn',ids.join(' + '));state.mergeMode=false;state.selectedTables=[];save();render();toast(`Đã ghép ${ids.join(' + ')}`)}
    function exportCsv(){const rows=state.bookings.filter(b=>b.date===state.date);const csv=[['Ngày','Giờ','Tên khách','Điện thoại','Số khách','Bàn','Tiền cọc','Trạng thái','Ghi chú'],...rows.map(b=>[b.date,b.time,b.name,b.phone,b.guests,b.tableIds.join(' + '),b.deposit,statusNames[b.status],b.note])].map(row=>row.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=`ganh-keo-booking-${state.date}.csv`;a.click();URL.revokeObjectURL(a.href)}
    function bind(){document.querySelectorAll('[data-page]').forEach(x=>x.addEventListener('click',()=>{state.page=x.dataset.page;render()}));document.querySelector('[data-date]')?.addEventListener('change',e=>{state.date=e.target.value;render()});document.querySelectorAll('[data-floor]').forEach(x=>x.addEventListener('click',()=>{state.floor=x.dataset.floor;render()}));document.querySelector('[data-action="theme"]')?.addEventListener('click',toggleTheme);document.querySelector('[data-action="new-booking"]')?.addEventListener('click',()=>openBooking());document.querySelector('[data-search]')?.addEventListener('input',e=>{state.search=e.target.value;const cursor=e.target.selectionStart;const value=e.target.value;const wrap=e.target.closest('.panel');const tbody=wrap.querySelector('tbody');const temp=document.createElement('div');temp.innerHTML=bookingTable();const newBody=temp.querySelector('tbody');tbody.innerHTML=newBody.innerHTML;tbody.querySelectorAll('[data-booking]').forEach(row=>row.addEventListener('click',()=>openBookingDetail(row.dataset.booking)));const inp=document.querySelector('[data-search]');inp.focus();inp.setSelectionRange(cursor,cursor)});document.querySelector('[data-status-filter]')?.addEventListener('change',e=>{state.statusFilter=e.target.value;render()});document.querySelector('[data-customer-search]')?.addEventListener('input',e=>{state.customerSearch=e.target.value;const cursor=e.target.selectionStart;render();const input=document.querySelector('[data-customer-search]');input.focus();input.setSelectionRange(cursor,cursor)});document.querySelectorAll('[data-customer-phone]').forEach(x=>x.addEventListener('click',()=>customerHistory(x.dataset.customerPhone)));document.querySelectorAll('[data-booking]').forEach(x=>x.addEventListener('click',e=>{if(e.target.closest('[draggable="true"]'))return;openBookingDetail(x.dataset.booking)}));document.querySelectorAll('[data-action="merge-mode"]').forEach(x=>x.addEventListener('click',()=>{state.mergeMode=true;state.selectedTables=[];render()}));document.querySelector('[data-action="cancel-merge"]')?.addEventListener('click',()=>{state.mergeMode=false;state.selectedTables=[];render()});document.querySelector('[data-action="confirm-merge"]')?.addEventListener('click',mergeSelected);document.querySelectorAll('[data-action="split-group"]').forEach(x=>x.addEventListener('click',()=>{const g=state.groups.find(g=>g.some(t=>floors.find(f=>f.id===state.floor)?.tables.includes(t)));if(!g){toast('Tầng này chưa có nhóm bàn ghép');return}splitGroup(g[0])}));document.querySelectorAll('[data-table]').forEach(card=>{card.addEventListener('click',e=>{if(e.target.closest('[data-booking]'))return;if(state.mergeMode){const id=card.dataset.table;state.selectedTables=state.selectedTables.includes(id)?state.selectedTables.filter(x=>x!==id):[...state.selectedTables,id];card.style.outline=state.selectedTables.includes(id)?'2px solid var(--green)':'';document.querySelector('[data-action="confirm-merge"]').innerHTML=`${ico('merge')} Xác nhận ghép (${state.selectedTables.length})`;return}openTable(card.dataset.table)});card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drop-over')});card.addEventListener('dragleave',()=>card.classList.remove('drop-over'));card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drop-over');const id=e.dataTransfer.getData('text/booking');if(id)moveBooking(id,card.dataset.table)})});document.querySelectorAll('[draggable="true"]').forEach(x=>x.addEventListener('dragstart',e=>e.dataTransfer.setData('text/booking',x.dataset.booking)));document.querySelectorAll('[data-report]').forEach(x=>x.addEventListener('click',()=>{state.reportMode=x.dataset.report;render()}));document.querySelector('[data-report-year]')?.addEventListener('change',e=>{const year=Math.max(2020,Math.min(2100,+e.target.value||2026));state.date=`${year}${state.date.slice(4)}`;render()});document.querySelector('[data-role]')?.addEventListener('change',e=>{state.role=e.target.value;localStorage.setItem('gk-role',state.role);render();toast(`Đã chuyển vai trò: ${state.role}`)});document.querySelector('[data-setting-theme]')?.addEventListener('change',toggleTheme);document.querySelector('[data-action="reset-data"]')?.addEventListener('click',()=>{if(!confirm('Xóa toàn bộ booking, lịch sử và nhóm bàn trên thiết bị này?'))return;state.bookings=[];state.history=[];state.groups=[];save();render();toast('Đã xóa dữ liệu trên thiết bị')});document.querySelector('[data-action="clear-history"]')?.addEventListener('click',()=>{if(confirm('Xóa toàn bộ lịch sử thao tác?')){state.history=[];save();render()}});document.querySelector('[data-action="export"]')?.addEventListener('click',exportCsv);document.querySelector('[data-action="alerts"]')?.addEventListener('click',()=>{const late=dayBookings().filter(b=>['confirmed','deposit'].includes(b.status)&&b.time<new Date().toTimeString().slice(0,5));toast(late.length?`${late.length} booking chưa check-in đã qua giờ dự kiến`:'Không có booking quá giờ chưa check-in')});document.querySelectorAll('[data-action="close-modal"]').forEach(x=>x.addEventListener('click',closeModal));document.querySelectorAll('[data-action="backdrop-close"]').forEach(x=>x.addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()}));document.querySelector('[data-action="new-at-table"]')?.addEventListener('click',e=>openBooking(null,[e.currentTarget.dataset.tableId]));document.querySelector('[data-action="save-booking"]')?.addEventListener('click',saveBooking);document.querySelector('[data-action="edit-booking"]')?.addEventListener('click',e=>openBooking(e.currentTarget.dataset.id));document.querySelector('[data-detail-checkin]')?.addEventListener('click',e=>checkIn(e.currentTarget.dataset.detailCheckin));document.querySelector('[data-complete]')?.addEventListener('click',e=>completeBooking(e.currentTarget.dataset.complete));document.querySelector('[data-action="split-this"]')?.addEventListener('click',e=>splitGroup(e.currentTarget.dataset.tableId));updateElapsed()}
    function moveBooking(id,table){const b=state.bookings.find(x=>x.id===id);if(!b||b.tableIds.includes(table))return;b.tableIds=[table];audit('Chuyển bàn bằng kéo thả',`${b.name} · ${table}`);save();render();toast(`Đã chuyển ${b.name} sang ${table}`)}
    function customerHistory(phone){const rows=state.bookings.filter(b=>b.phone===phone).sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));const c=rows[0];modal(`Lịch sử · ${esc(c?.name||'Khách hàng')}`,`${esc(phone)} · ${rows.length} lượt đặt`,rows.map(b=>`<div class="booking-row" data-booking="${b.id}"><div class="time-mark">${b.time}</div><div class="booking-info"><strong>${dateLabel(b.date,{day:'numeric',month:'short',year:'numeric'})} · ${displayTables(b)}</strong><small>${b.guests} khách · cọc ${money(b.deposit)}</small></div>${statusTag(b.status)}</div>`).join('')||'<div class="empty-state">Chưa có lịch sử.</div>','<button class="btn" data-action="close-modal">Đóng</button>',true);document.querySelectorAll('[data-booking]').forEach(x=>x.addEventListener('click',()=>openBookingDetail(x.dataset.booking)))}
    function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=state.theme;localStorage.setItem('gk-theme',state.theme);render()}
    function updateElapsed(){document.querySelectorAll('[data-elapsed]').forEach(el=>{const seconds=Math.max(0,Math.floor((Date.now()-new Date(el.dataset.elapsed).getTime())/1000));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;el.textContent=`${h?`${h} giờ `:''}${String(m).padStart(2,'0')} phút ${String(s).padStart(2,'0')} giây`})}
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    document.addEventListener('click',e=>{const slot=e.target.closest('.table-card .slot[data-booking]');if(slot?.isConnected){openTable(slot.closest('[data-table]').dataset.table);return}const row=e.target.closest('tr[data-booking],.modal .booking-row[data-booking]');if(row?.isConnected)openBookingDetail(row.dataset.booking)});
    render();setInterval(updateElapsed,1000);
  </script>
